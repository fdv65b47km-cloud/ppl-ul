<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>Workout Plan</title>
  <style>
    :root{
      --bg:#0b0b0d;
      --card:#151518;
      --card-2:#1c1c20;
      --text:#f5f5f7;
      --muted:#9b9ba3;
      --line:#2a2a30;
      --accent:#ffffff;
      --radius:22px;
    }

    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;
      background:
        radial-gradient(circle at 50% -10%, rgba(255,255,255,.08), transparent 26%),
        var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }

    .app{
      width:min(100%, 430px);
      margin:0 auto;
      padding:
        calc(env(safe-area-inset-top) + 18px)
        16px
        calc(env(safe-area-inset-bottom) + 28px);
    }

    .topbar{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }

    .eyebrow{
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
      margin-bottom:4px;
    }

    h1{
      margin:0;
      font-size:32px;
      line-height:1;
      letter-spacing:-.04em;
    }

    .pill{
      flex:0 0 auto;
      padding:8px 10px;
      border-radius:999px;
      background:var(--card-2);
      border:1px solid var(--line);
      color:#d7d7dc;
      font-size:12px;
      font-weight:700;
    }

    .summary{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-bottom:16px;
    }

    .summary-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px 10px;
      text-align:center;
    }

    .summary-card strong{
      display:block;
      font-size:15px;
      margin-bottom:3px;
    }

    .summary-card span{
      color:var(--muted);
      font-size:11px;
    }

    .workout{
      background:linear-gradient(180deg,var(--card),#111114);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      margin-bottom:12px;
      box-shadow:0 8px 30px rgba(0,0,0,.16);
    }

    .workout-header{
      width:100%;
      background:transparent;
      color:var(--text);
      border:0;
      padding:17px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      text-align:left;
      cursor:pointer;
      font:inherit;
    }

    .workout-title{
      display:flex;
      flex-direction:column;
      gap:3px;
    }

    .workout-title strong{
      font-size:19px;
      letter-spacing:-.02em;
    }

    .workout-title span{
      color:var(--muted);
      font-size:12px;
    }

    .chevron{
      width:28px;
      height:28px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:var(--card-2);
      border:1px solid var(--line);
      color:#cfcfd5;
      transition:.2s ease;
      font-size:16px;
    }

    .workout.open .chevron{transform:rotate(180deg)}

    .exercise-list{
      display:none;
      border-top:1px solid var(--line);
      padding:5px 16px 10px;
    }

    .workout.open .exercise-list{display:block}

    .exercise{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:13px 0;
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .exercise:last-child{border-bottom:0}

    .exercise-name{
      font-size:15px;
      font-weight:650;
      line-height:1.25;
    }

    .sets{
      color:var(--muted);
      font-size:11px;
      white-space:nowrap;
      background:#101013;
      border:1px solid var(--line);
      border-radius:999px;
      padding:6px 8px;
    }

    .footer-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:15px;
    }

    .info{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
    }

    .info small{
      display:block;
      color:var(--muted);
      font-weight:700;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:5px;
    }

    .info strong{
      font-size:14px;
      line-height:1.35;
    }

    .note{
      margin-top:12px;
      color:#777780;
      font-size:11px;
      text-align:center;
    }

    @media (min-width: 431px){
      body{padding:28px 0}
      .app{
        border:1px solid #222228;
        border-radius:40px;
        min-height:820px;
        box-shadow:0 30px 80px rgba(0,0,0,.5);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">PPL × Upper / Lower</div>
        <h1>Training Plan</h1>
      </div>
      <div class="pill">0–2 RIR</div>
    </header>

    <section class="summary">
      <div class="summary-card">
        <strong>2</strong>
        <span>Sets</span>
      </div>
      <div class="summary-card">
        <strong>8–12</strong>
        <span>Reps</span>
      </div>
      <div class="summary-card">
        <strong>5</strong>
        <span>Days</span>
      </div>
    </section>

    <div id="workouts"></div>

    <section class="footer-grid">
      <div class="info">
        <small>Cardio</small>
        <strong>20–25 min incline treadmill × 2/week</strong>
      </div>
      <div class="info">
        <small>Steps</small>
        <strong>8–12k per day</strong>
      </div>
    </section>

    <div class="note">Tap a workout to open it.</div>
  </main>

  <script>
    const plan = [
      {
        name: "Push",
        exercises: [
          "Incline chest press",
          "Cable flies",
          "Shoulder press",
          "Cable lateral raises",
          "Cable overhead extension",
          "Rope triceps"
        ]
      },
      {
        name: "Pull",
        exercises: [
          "Pull-downs",
          "T-bar rows",
          "Single-arm cable row",
          "Reverse fly machine",
          "Bayesian curl",
          "Hammer curls"
        ]
      },
      {
        name: "Legs",
        exercises: [
          "Leg extensions",
          "Leg press",
          "Leg curls",
          "Hip thrusts",
          "Standing calf raises",
          "Back extensions"
        ]
      },
      {
        name: "Upper Body",
        exercises: [
          "Incline dumbbell press",
          "Pec deck",
          "Machine lateral raises",
          "Lat pulldown",
          "Machine rows",
          "Triceps pushdown",
          "Preacher curl"
        ]
      },
      {
        name: "Lower Body",
        exercises: [
          "Lying leg curl",
          "Squat",
          "Leg extension",
          "Hip thrust",
          "Standing calf raise",
          "Machine ab crunches"
        ]
      }
    ];

    const workouts = document.getElementById("workouts");

    plan.forEach((day, index) => {
      const card = document.createElement("section");
      card.className = "workout" + (index === 0 ? " open" : "");

      card.innerHTML = `
        <button class="workout-header" aria-expanded="${index === 0}">
          <div class="workout-title">
            <strong>${day.name}</strong>
            <span>${day.exercises.length} exercises</span>
          </div>
          <span class="chevron">⌄</span>
        </button>
        <div class="exercise-list">
          ${day.exercises.map(exercise => `
            <div class="exercise">
              <div class="exercise-name">${exercise}</div>
              <div class="sets">2 × 8–12</div>
            </div>
          `).join("")}
        </div>
      `;

      const button = card.querySelector(".workout-header");
      button.addEventListener("click", () => {
        const isOpen = card.classList.toggle("open");
        button.setAttribute("aria-expanded", isOpen);
      });

      workouts.appendChild(card);
    });
  </script>
</body>
</html>
