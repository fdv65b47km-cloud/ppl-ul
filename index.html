<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym Plan" />
  <title>Gym Plan</title>
  <style>
    :root{
      --bg:#09090b;
      --panel:#141417;
      --panel2:#1b1b20;
      --line:#2a2a31;
      --text:#f7f7f8;
      --muted:#9b9ba4;
      --good:#d8ffd8;
      --danger:#ffb0b0;
      --radius:22px;
    }

    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(circle at 50% -5%, rgba(255,255,255,.07), transparent 25%),
        var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      overscroll-behavior-y:none;
    }

    button,input{font:inherit}

    .app{
      width:min(100%,430px);
      margin:0 auto;
      padding:
        calc(env(safe-area-inset-top) + 16px)
        14px
        calc(env(safe-area-inset-bottom) + 110px);
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:12px;
      margin-bottom:14px;
    }

    .eyebrow{
      color:var(--muted);
      font-size:11px;
      font-weight:800;
      letter-spacing:.13em;
      text-transform:uppercase;
      margin-bottom:5px;
    }

    h1{
      margin:0;
      font-size:31px;
      letter-spacing:-.045em;
      line-height:1;
    }

    .rir{
      border:1px solid var(--line);
      background:var(--panel2);
      color:#dedee2;
      border-radius:999px;
      padding:8px 10px;
      font-size:12px;
      font-weight:750;
      white-space:nowrap;
    }

    .summary{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-bottom:14px;
    }

    .summary-card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      padding:11px 8px;
      text-align:center;
    }

    .summary-card strong{
      display:block;
      font-size:15px;
      margin-bottom:2px;
    }

    .summary-card span{
      color:var(--muted);
      font-size:10px;
    }

    .workout{
      background:linear-gradient(180deg,var(--panel),#111114);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      margin-bottom:11px;
      box-shadow:0 8px 28px rgba(0,0,0,.16);
    }

    .workout.done{
      outline:1px solid rgba(216,255,216,.14);
    }

    .workout-header{
      width:100%;
      border:0;
      color:var(--text);
      background:transparent;
      display:flex;
      justify-content:space-between;
      align-items:center;
      text-align:left;
      padding:16px;
      cursor:pointer;
    }

    .workout-title{
      display:flex;
      flex-direction:column;
      gap:3px;
    }

    .workout-title strong{
      font-size:18px;
      letter-spacing:-.02em;
    }

    .workout-title span{
      color:var(--muted);
      font-size:11px;
    }

    .chevron{
      width:29px;
      height:29px;
      display:grid;
      place-items:center;
      border-radius:50%;
      border:1px solid var(--line);
      background:var(--panel2);
      transition:.2s ease;
      color:#d7d7dc;
    }

    .workout.open .chevron{transform:rotate(180deg)}

    .exercise-list{
      display:none;
      border-top:1px solid var(--line);
      padding:5px 12px 11px;
    }

    .workout.open .exercise-list{display:block}

    .exercise{
      padding:12px 2px 13px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .exercise:last-child{border-bottom:0}

    .exercise-top{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .check{
      appearance:none;
      -webkit-appearance:none;
      width:23px;
      height:23px;
      flex:0 0 23px;
      border-radius:50%;
      border:1.5px solid #4a4a52;
      background:#101013;
      display:grid;
      place-items:center;
      cursor:pointer;
    }

    .check:checked{
      background:#f1f1f3;
      border-color:#f1f1f3;
    }

    .check:checked::after{
      content:"✓";
      color:#09090b;
      font-size:14px;
      font-weight:900;
    }

    .exercise-name{
      flex:1;
      min-width:0;
      font-size:15px;
      font-weight:700;
      line-height:1.2;
    }

    .exercise-meta{
      color:var(--muted);
      font-size:10px;
      border:1px solid var(--line);
      background:#101013;
      border-radius:999px;
      padding:5px 7px;
      white-space:nowrap;
    }

    .sets-grid{
      display:grid;
      grid-template-columns:34px 1fr 1fr;
      gap:7px;
      align-items:center;
    }

    .set-label{
      color:var(--muted);
      font-size:11px;
      font-weight:800;
      text-align:center;
    }

    .field-wrap{
      position:relative;
    }

    .field-wrap input{
      width:100%;
      border:1px solid var(--line);
      background:#101013;
      color:var(--text);
      border-radius:12px;
      padding:10px 33px 10px 10px;
      outline:none;
      font-size:14px;
    }

    .field-wrap input:focus{
      border-color:#585862;
      background:#121216;
    }

    .unit{
      position:absolute;
      right:9px;
      top:50%;
      transform:translateY(-50%);
      color:#777780;
      font-size:10px;
      pointer-events:none;
    }

    .footer-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
      margin-top:14px;
    }

    .info{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:18px;
      padding:13px;
    }

    .info small{
      display:block;
      color:var(--muted);
      font-size:10px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:5px;
    }

    .info strong{
      font-size:13px;
      line-height:1.35;
    }

    .reset-row{
      display:flex;
      gap:8px;
      margin-top:10px;
    }

    .secondary{
      flex:1;
      border:1px solid var(--line);
      background:var(--panel);
      color:#c6c6cc;
      border-radius:14px;
      padding:12px 10px;
      font-size:12px;
      font-weight:750;
    }

    .timer-dock{
      position:fixed;
      left:50%;
      bottom:calc(env(safe-area-inset-bottom) + 10px);
      transform:translateX(-50%);
      width:min(calc(100% - 22px),408px);
      z-index:20;
      background:rgba(20,20,23,.92);
      border:1px solid var(--line);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-radius:22px;
      padding:10px;
      box-shadow:0 16px 50px rgba(0,0,0,.45);
      display:grid;
      grid-template-columns:1fr auto;
      gap:9px;
      align-items:center;
    }

    .timer-info{
      padding-left:4px;
    }

    .timer-info small{
      display:block;
      color:var(--muted);
      font-size:10px;
      margin-bottom:1px;
      font-weight:750;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .timer-display{
      font-size:25px;
      font-weight:850;
      letter-spacing:-.03em;
      font-variant-numeric:tabular-nums;
    }

    .timer-actions{
      display:flex;
      gap:7px;
    }

    .timer-btn{
      border:0;
      border-radius:15px;
      background:#f1f1f3;
      color:#09090b;
      padding:12px 14px;
      font-size:12px;
      font-weight:850;
      min-width:78px;
    }

    .timer-btn.stop{
      background:#232329;
      color:#d2d2d7;
      border:1px solid var(--line);
      min-width:54px;
    }

    .hint{
      margin:11px 4px 0;
      color:#686871;
      font-size:10px;
      text-align:center;
      line-height:1.4;
    }

    @media (min-width:431px){
      body{padding:24px 0}
      .app{
        border:1px solid #222229;
        min-height:850px;
        border-radius:42px;
        box-shadow:0 30px 80px rgba(0,0,0,.5);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <div class="eyebrow">PPL × Upper / Lower</div>
        <h1>Training Plan</h1>
      </div>
      <div class="rir">0–2 RIR</div>
    </header>

    <section class="summary">
      <div class="summary-card"><strong>2</strong><span>Sets</span></div>
      <div class="summary-card"><strong>8–12</strong><span>Reps</span></div>
      <div class="summary-card"><strong>5</strong><span>Days</span></div>
    </section>

    <div id="workouts"></div>

    <section class="footer-grid">
      <div class="info">
        <small>Cardio</small>
        <strong>20–25 min incline treadmill × 2/week</strong>
      </div>
      <div class="info">
        <small>Steps</small>
        <strong>8–12k/day</strong>
      </div>
    </section>

    <div class="reset-row">
      <button class="secondary" id="resetChecks">Reset checkmarks</button>
      <button class="secondary" id="resetAll">Reset all data</button>
    </div>

    <div class="hint">
      Your weights, reps and completed exercises are saved automatically on this device.
    </div>
  </main>

  <aside class="timer-dock">
    <div class="timer-info">
      <small>Rest timer</small>
      <div class="timer-display" id="timerDisplay">03:00</div>
    </div>
    <div class="timer-actions">
      <button class="timer-btn" id="timerStart">Start 3:00</button>
      <button class="timer-btn stop" id="timerStop">Reset</button>
    </div>
  </aside>

  <script>
    const plan = [
      {name:"Push",exercises:[
        "Incline chest press","Cable flies","Shoulder press",
        "Cable lateral raises","Cable overhead extension","Rope triceps"
      ]},
      {name:"Pull",exercises:[
        "Pull-downs","T-bar rows","Single-arm cable row",
        "Reverse fly machine","Bayesian curl","Hammer curls"
      ]},
      {name:"Legs",exercises:[
        "Leg extensions","Leg press","Leg curls","Hip thrusts",
        "Standing calf raises","Back extensions"
      ]},
      {name:"Upper Body",exercises:[
        "Incline dumbbell press","Pec deck","Machine lateral raises",
        "Lat pulldown","Machine rows","Triceps pushdown","Preacher curl"
      ]},
      {name:"Lower Body",exercises:[
        "Lying leg curl","Squat","Leg extension","Hip thrust",
        "Standing calf raise","Machine ab crunches"
      ]}
    ];

    const STORAGE_KEY = "ppl_ul_gym_data_v2";

    function getData(){
      try{
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      }catch{
        return {};
      }
    }

    function saveData(data){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    let data = getData();
    const container = document.getElementById("workouts");

    function slug(text){
      return text.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    }

    function keyFor(dayName, exerciseName){
      return `${slug(dayName)}__${slug(exerciseName)}`;
    }

    function render(){
      container.innerHTML = "";

      plan.forEach((day, dayIndex)=>{
        const dayEl = document.createElement("section");
        dayEl.className = "workout" + (dayIndex===0 ? " open" : "");

        const completedCount = day.exercises.filter(ex => data[keyFor(day.name,ex)]?.done).length;

        dayEl.innerHTML = `
          <button class="workout-header" aria-expanded="${dayIndex===0}">
            <div class="workout-title">
              <strong>${day.name}</strong>
              <span>${completedCount}/${day.exercises.length} completed</span>
            </div>
            <span class="chevron">⌄</span>
          </button>
          <div class="exercise-list"></div>
        `;

        const list = dayEl.querySelector(".exercise-list");

        day.exercises.forEach(exercise=>{
          const k = keyFor(day.name, exercise);
          data[k] ||= {done:false, sets:[{weight:"",reps:""},{weight:"",reps:""}]};
          if(!Array.isArray(data[k].sets) || data[k].sets.length !== 2){
            data[k].sets = [{weight:"",reps:""},{weight:"",reps:""}];
          }

          const exEl = document.createElement("div");
          exEl.className = "exercise";
          exEl.innerHTML = `
            <div class="exercise-top">
              <input class="check" type="checkbox" ${data[k].done ? "checked" : ""} aria-label="Complete ${exercise}">
              <div class="exercise-name">${exercise}</div>
              <div class="exercise-meta">2 × 8–12</div>
            </div>
            <div class="sets-grid">
              <div class="set-label">S1</div>
              <div class="field-wrap">
                <input inputmode="decimal" type="number" min="0" step="0.5" placeholder="Weight" value="${data[k].sets[0].weight ?? ""}">
                <span class="unit">kg</span>
              </div>
              <div class="field-wrap">
                <input inputmode="numeric" type="number" min="0" max="99" step="1" placeholder="Reps" value="${data[k].sets[0].reps ?? ""}">
                <span class="unit">reps</span>
              </div>

              <div class="set-label">S2</div>
              <div class="field-wrap">
                <input inputmode="decimal" type="number" min="0" step="0.5" placeholder="Weight" value="${data[k].sets[1].weight ?? ""}">
                <span class="unit">kg</span>
              </div>
              <div class="field-wrap">
                <input inputmode="numeric" type="number" min="0" max="99" step="1" placeholder="Reps" value="${data[k].sets[1].reps ?? ""}">
                <span class="unit">reps</span>
              </div>
            </div>
          `;

          const check = exEl.querySelector(".check");
          const inputs = exEl.querySelectorAll(".field-wrap input");

          check.addEventListener("change", ()=>{
            data[k].done = check.checked;
            saveData(data);
            updateDayProgress(dayEl, day);
          });

          inputs.forEach((input, idx)=>{
            input.addEventListener("input", ()=>{
              const setIndex = idx < 2 ? 0 : 1;
              const field = idx % 2 === 0 ? "weight" : "reps";
              data[k].sets[setIndex][field] = input.value;
              saveData(data);
            });
          });

          list.appendChild(exEl);
        });

        const header = dayEl.querySelector(".workout-header");
        header.addEventListener("click", ()=>{
          const open = dayEl.classList.toggle("open");
          header.setAttribute("aria-expanded", open);
        });

        container.appendChild(dayEl);
      });

      saveData(data);
    }

    function updateDayProgress(dayEl, day){
      const completedCount = day.exercises.filter(ex => data[keyFor(day.name,ex)]?.done).length;
      const sub = dayEl.querySelector(".workout-title span");
      sub.textContent = `${completedCount}/${day.exercises.length} completed`;
      dayEl.classList.toggle("done", completedCount === day.exercises.length);
    }

    render();

    document.getElementById("resetChecks").addEventListener("click", ()=>{
      Object.values(data).forEach(item=>{
        if(item && typeof item === "object") item.done = false;
      });
      saveData(data);
      render();
    });

    document.getElementById("resetAll").addEventListener("click", ()=>{
      if(confirm("Delete all saved weights, reps and checkmarks?")){
        localStorage.removeItem(STORAGE_KEY);
        data = {};
        render();
      }
    });

    // Timer
    const timerDisplay = document.getElementById("timerDisplay");
    const timerStart = document.getElementById("timerStart");
    const timerStop = document.getElementById("timerStop");

    let remaining = 180;
    let interval = null;

    function fmt(seconds){
      const m = Math.floor(seconds/60).toString().padStart(2,"0");
      const s = (seconds%60).toString().padStart(2,"0");
      return `${m}:${s}`;
    }

    function refreshTimer(){
      timerDisplay.textContent = fmt(remaining);
      timerStart.textContent = interval ? "Running…" : "Start 3:00";
    }

    function finishTimer(){
      clearInterval(interval);
      interval = null;
      remaining = 0;
      refreshTimer();

      if("vibrate" in navigator){
        navigator.vibrate([300,150,300,150,500]);
      }

      if("Notification" in window && Notification.permission === "granted"){
        new Notification("Rest finished", {body:"Time for your next set."});
      }

      setTimeout(()=>{
        remaining = 180;
        refreshTimer();
      }, 2500);
    }

    timerStart.addEventListener("click", async ()=>{
      if(interval) return;

      if(remaining <= 0) remaining = 180;

      if("Notification" in window && Notification.permission === "default"){
        try{ await Notification.requestPermission(); }catch(e){}
      }

      interval = setInterval(()=>{
        remaining -= 1;
        if(remaining <= 0){
          finishTimer();
        }else{
          refreshTimer();
        }
      },1000);

      refreshTimer();
    });

    timerStop.addEventListener("click", ()=>{
      clearInterval(interval);
      interval = null;
      remaining = 180;
      refreshTimer();
    });

    refreshTimer();
  </script>
</body>
</html>
